<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Overtime Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div>
        <h1>Overtime Tracker</h1>
        <p class="subtitle">Track your daily overtime seamlessly</p>
      </div>
      <button id="darkModeToggle" class="btn-secondary">🌙 Dark Mode</button>
    </div>

    <!-- Summary -->
    <div class="summary-card">
      <div class="summary-item">
        <div class="label">Total Working Days</div>
        <div class="value" id="totalRecords">0</div>
      </div>
      <div class="summary-item">
        <div class="label">Total Overtime</div>
        <div class="value" id="totalOvertime">00:00</div>
      </div>
    </div>

    <!-- Controls / Filters -->
    <div class="controls-section">
      <div class="filters">
        <select id="monthFilter"></select>
        <select id="yearFilter"></select>
      </div>
      <div class="actions">
        <button id="exportCsv" class="btn-secondary">Export CSV</button>
        <label class="btn-secondary">
          Import CSV
          <input type="file" id="importCsv" accept=".csv" hidden>
        </label>
        <button id="backupJson" class="btn-secondary">Backup JSON</button>
        <label class="btn-secondary">
          Restore JSON
          <input type="file" id="restoreJson" accept=".json" hidden>
        </label>
      </div>
    </div>

    <!-- Form -->
    <div class="card">
      <h2 class="card-title">Add / Edit Record</h2>
      <form id="otForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label>Clock In</label>
            <input type="time" id="clockIn">
          </div>
          <div class="form-group">
            <label>Clock Out</label>
            <input type="time" id="clockOut">
          </div>
          <div class="form-group">
            <label>Day</label>
            <input type="text" id="dayName" readonly>
          </div>
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label>Notes (Optional)</label>
          <input type="text" id="notes" placeholder="Enter any notes here...">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Record</button>
          <button type="button" id="clearBtn" class="btn-secondary">Clear Form</button>
        </div>
      </form>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div class="table-wrapper">
        <table id="recordsTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Day</th>
              <th>Clock In</th>
              <th>Clock Out</th>
              <th>Total OT</th>
              <th>Notes</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
          <tfoot id="recordsFoot">
            <tr class="grand-total-row">
              <td colspan="4"><strong>Monthly Grand Total</strong></td>
              <td id="grandTotalCell"><strong>00:00</strong></td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
