<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Overtime Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- SheetJS for Excel Export/Import -->
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="authContainer" class="auth-wrapper fade-in">
    <div class="card auth-card">
      <h2 style="text-align: center; margin-bottom: 20px;" id="authTitle">Login to your account</h2>
      
      <!-- Login / Signup Toggle -->
      <div class="auth-toggle">
        <button type="button" id="showLoginBtn" class="active">Login</button>
        <button type="button" id="showSignupBtn">Sign Up</button>
      </div>

      <!-- Common Fields -->
      <div class="form-group"><label>Email</label><input type="email" id="emailInput" placeholder="name@example.com"></div>
      <div class="form-group" style="margin-top: 12px;"><label>Password</label><input type="password" id="passwordInput" placeholder="••••••••"></div>

      <!-- Extra Fields for Sign Up (Hidden by default) -->
      <div id="signupFields" style="display: none; margin-top: 12px;">
        <div class="form-grid">
          <div class="form-group"><label>Nick Name *</label><input type="text" id="nickNameInput" placeholder="e.g. Miraj"></div>
          <div class="form-group"><label>Full Name</label><input type="text" id="fullNameInput" placeholder="(Optional)"></div>
        </div>
        <div class="form-group" style="margin-top: 12px;"><label>Institution Name *</label><input type="text" id="institutionInput" placeholder="Where do you work?"></div>
        <div class="form-group" style="margin-top: 12px;"><label>Contact Number *</label><input type="text" id="contactInput" placeholder="Phone Number"></div>
        
        <div class="form-grid" style="margin-top: 12px;">
          <div class="form-group"><label>Office Start Time *</label><input type="time" id="officeStartInput"></div>
          <div class="form-group"><label>Office End Time *</label><input type="time" id="officeEndInput"></div>
        </div>
      </div>

      <div id="authError" style="font-size: 13px; margin-top: 15px; display: none;"></div>
      <button id="authSubmitBtn" class="btn-primary" style="width: 100%; margin-top: 20px;">Login</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="container fade-in" id="appContainer" style="display: none;">
    
    <!-- Header with Profile Info -->
    <div class="header">
      <div style="flex: 1;">
        <h1>Overtime Tracker</h1>
        
        <!-- User Information Dashboard -->
        <div class="user-profile-info" id="userProfileInfo">
           <div class="profile-col">
              <div class="p-item"><i data-lucide="user"></i> <span id="pName">Name</span></div>
              <div class="p-item"><i data-lucide="building"></i> <span id="pInst">Institution</span></div>
           </div>
           <div class="profile-col">
              <div class="p-item"><i data-lucide="phone"></i> <span id="pContact">Contact</span></div>
              <div class="p-item"><i data-lucide="clock"></i> <span id="pTime">Office Time</span></div>
           </div>
        </div>

      </div>
      <div style="display: flex; gap: 12px; align-items: flex-start; margin-left: 20px;">
        <button id="darkModeToggle" class="btn-outline"><i data-lucide="moon"></i></button>
        <button id="logoutBtn" class="btn-outline" style="color: #ef4444; border-color: #ef4444;"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-card">
      <div class="summary-item">
        <div class="label"><i data-lucide="calendar-days"></i> Working Days</div>
        <div class="value" id="totalRecords">0</div>
      </div>
      <div class="summary-item">
        <div class="label"><i data-lucide="clock"></i> Total Overtime</div>
        <div class="value" id="totalOvertime">00:00</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-section">
      <div class="filters">
        <div class="select-wrapper"><select id="monthFilter"></select><i data-lucide="chevron-down" class="select-icon"></i></div>
        <div class="select-wrapper"><select id="yearFilter"></select><i data-lucide="chevron-down" class="select-icon"></i></div>
      </div>
      <div class="actions">
        <button id="exportExcel" class="btn-outline"><i data-lucide="download"></i> Export Excel</button>
        <label class="btn-outline cursor-pointer">
          <i data-lucide="upload"></i> Import Excel
          <input type="file" id="importExcel" accept=".xlsx, .xls" hidden>
        </label>
      </div>
    </div>

    <!-- Form -->
    <div class="card">
      <h2 class="card-title"><i data-lucide="plus-circle"></i> Add / Edit Record</h2>
      <form id="otForm">
        <div class="form-grid">
          <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
          <div class="form-group"><label>Clock In</label><input type="time" id="clockIn"></div>
          <div class="form-group"><label>Clock Out</label><input type="time" id="clockOut"></div>
          <div class="form-group"><label>Day</label><input type="text" id="dayName" readonly></div>
        </div>
        <div class="form-group" style="margin-top: 20px;"><label>Notes</label><input type="text" id="notes"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary"><i data-lucide="save"></i> Save Record</button>
          <button type="button" id="clearBtn" class="btn-ghost"><i data-lucide="x"></i> Clear</button>
        </div>
      </form>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div class="table-wrapper">
        <table id="recordsTable">
          <thead><tr><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Total OT</th><th>Notes</th><th style="text-align: right;">Actions</th></tr></thead>
          <tbody id="recordsBody"></tbody>
          <tfoot><tr class="grand-total-row"><td colspan="4"><strong>Grand Total</strong></td><td id="grandTotalCell"><strong>00:00</strong></td><td colspan="2"></td></tr></tfoot>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
